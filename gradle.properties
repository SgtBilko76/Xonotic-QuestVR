# keep the heap inside this machine's 2.7GB RAM (a 3GB request got OOM-killed while
# packaging the 1.1GB bundled game data; APK packaging streams and needs little heap)
org.gradle.jvmargs=-Xmx1280m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
