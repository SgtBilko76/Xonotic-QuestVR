// XONOTICVR_VRCFG_REV 5
// XonoticQuest VR defaults - executed at startup via commandline.txt (+exec vr.cfg)
// This file is regenerated from the app's bundled assets whenever the REV line above
// changes (see LauncherActivity.copyVrConfig) - bump it whenever this file is edited, or
// the fix won't reach devices that already installed an earlier build. Not a place for
// lasting hand-edits on the device; the engine already loads config.cfg (archived cvars)
// before this file, specifically so this file can always override them.

// ---- VR ----
vr_worldscale 39
vr_supersampling 0.9
vr_refreshrate 72
// single-pass stereo (both eyes in one draw) - the big framerate win. vr_multiview is
// CF_ARCHIVE, so assert it here: a stray archived "vr_multiview 0" in config.cfg execs
// before this and would otherwise silently drop us to the slower two-pass path.
vr_multiview 1
// foveated rendering: level 2's low-res peripheral tiles dissolved thin walls
// ("seeing through walls" artifacts, user-confirmed fixed by disabling). Level 1 was
// tested 2026-09-06 and left off (2026-09-07): the framerate is already perfect at 0.
vr_foveation 0
// The big 2026-09-16 "background bleeding through walls" bug: the map's precomputed PVS
// visibility data doesn't account for VR's much wider effective FOV, so nearby walls just
// outside it were never drawn, leaving the sky (drawn first, see r_sky.c) visible through
// them. Fixed at the engine level (gl_rmain.c: VR bypasses PVS/portal vis, frustum-only).
// r_reflectcube 0 substitutes a neutral white cubemap for glossy materials' reflections
// instead of the real sky/environment image, which read as a smaller, separate artifact on
// chrome-like trim once the PVS bug above was fixed (kept, since a literal sky reflection on
// nearby surfaces still reads oddly in VR) - the reflective shading itself stays enabled, so
// materials that depend on it entirely (some chrome trim has no other texture) don't go blank.
r_reflectcube 0
// r_tcgen_environment was disabled 2026-09-16 on a misdiagnosis before the PVS bug above was
// found - it spheremaps a material's own (usually static "chrome" look) texture, unrelated to
// the sky, and disabling it left some objects (e.g. machinery gears) rendering blank. Left at
// its engine default (1) since it was never actually part of the bug.
r_sky 1
vr_yawmode 0
cl_comfort 45
vr_turnspeed 120
cl_walkdirection 0
cl_righthanded 1
vr_weaponpitchadjust -20
vr_weaponscale 1
vr_hudscale 0.55
vr_hudstereo 0.003
vr_screen_distance 5
r_lasersight 0            // aim is shown by the game's own crosshair (drawn per eye along the controller)
vr_viewkick 0

// ---- view must not fight the HMD / hand ----
// game crosshair stays on; showimpact puts it at the hit surface's depth so both eyes fuse on it
crosshair_hittest_showimpact 1
// no black scope overlay while zooming; the crosshair alone marks the aim in VR
cl_reticle 0
cl_bob 0
cl_bob2 0
cl_bobfall 0
cl_bobmodel 0
cl_followmodel 0
cl_leanmodel 0
v_idlescale 0
cl_viewmodel_scale 1
cl_gunalign 3
cl_gunoffset "0 0 0"

// ---- frame pacing is owned by xrWaitFrame ----
cl_maxfps 0
cl_maxidlefps 0
cl_minfps 0
vid_vsync 0

// ---- Quest / Adreno performance ----
r_texture_dds_swdecode 1
gl_texturecompression 0
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_shadow_shadowmapping 0
r_bloom 0
r_hdr 0
r_hdr_scenebrightness 1.3
r_glsl_postprocess 0
r_water 0
r_coronas 0
r_dynamic 0
gl_picmip 1
// keep the engine default: higher values open visible cracks at curved-surface seams
r_subdivisions_tolerance 4
// entity trace culling (probabilistic raycast visibility for brush entities, not the main
// worldmodel) was too eager for VR even after tuning samples/expand up: large brush-model
// walls still vanished for stretches, showing the sky/map background through them
// (user-reported 2026-09-16, screenshots showed sky/mountains bleeding through solid walls).
// Disabled outright - framerate has headroom now that vr_multiview is actually taking effect.
r_cullentities_trace 0
r_cullentities_trace_samples 4
r_cullentities_trace_expand 8
cl_particles_quality 0.5
// stencil blob shadows bleed through world geometry in VR (dark shapes from other rooms
// read as "seeing through walls") - keep them off
r_shadows 0
r_motionblur 0
r_damageblur 0
r_drawparticles_drawdistance 500
gl_max_size 1024
r_picmipworld 0
vid_conwidth 1280
vid_conheight 720
snd_speed 44100
snd_channels 2
sys_stdout 1
locksession 0

// ---- CPU relief ----
cl_particles_collisions 0

// ---- net ----
cl_curl_enabled 1
cl_curl_maxdownloads 3

// ---- controller binds (the VR layer feeds these keys) ----
// aim hand: trigger = MOUSE1 (+fire), grip = MOUSE2 (+fire2), stick up = MOUSE3 (+zoom), stick down = CTRL (+crouch)
// off hand: trigger = SPACE (+jump), grip = MOUSE4 (+hook); A = MWHEELUP (next weapon), B = MWHEELDOWN (prev weapon), Y = TAB, X = JOY1
// right stick click = recenter view, left stick click = JOY2, left menu button = ESCAPE
bind MOUSE2 +fire2
bind MOUSE3 +zoom
bind MOUSE4 +hook
bind JOY1 +use
// JOY2 (left stick click) is free to bind
